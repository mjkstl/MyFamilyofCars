name: CI — build & deploy web

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and export web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Export Expo web build
        env:
          CI: true
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web

      - name: Upload Expo web build
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-dist
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy to Vercel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Download Expo web build
        uses: actions/download-artifact@v4
        with:
          name: expo-web-dist
          path: dist

      - name: Deploy static export to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          VERCEL_ARGS=(--prod --token "$VERCEL_TOKEN" --project "$VERCEL_PROJECT_ID" --yes ./dist)
          if [ -n "$VERCEL_ORG_ID" ]; then
            VERCEL_ARGS+=(--scope "$VERCEL_ORG_ID")
          fi
          npx vercel "${VERCEL_ARGS[@]}"
