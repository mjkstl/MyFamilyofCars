name: CI — build & deploy web

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and export web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Export Expo web build
        env:
          CI: true
        run: npx expo export --platform web

  deploy:
    name: Deploy to Vercel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy static export to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          SCOPE_FLAG=""
          if [ -n "$VERCEL_ORG_ID" ]; then
            SCOPE_FLAG="--scope \"$VERCEL_ORG_ID\""
          fi
          npx vercel --prod --token "$VERCEL_TOKEN" --project "$VERCEL_PROJECT_ID" $SCOPE_FLAG --yes ./dist
