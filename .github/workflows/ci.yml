name: CI — build & typecheck

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and export web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Export Expo web build
        env:
          CI: true
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web

      - name: Upload Expo web build
        uses: actions/upload-artifact@v4
        with:
          name: expo-web-dist
          path: dist
          if-no-files-found: error

  # Deployment is now handled by Vercel's native GitHub integration
  # (connected directly in the Vercel dashboard) rather than a CLI step
  # here — it deploys automatically on every push to main without
  # needing VERCEL_TOKEN/PROJECT_ID/ORG_ID as GitHub secrets at all.
  # This job stays purely as a code-quality gate: if typecheck or the
  # web export fails, you'll see it here independently of whether
  # Vercel's own build succeeds.

